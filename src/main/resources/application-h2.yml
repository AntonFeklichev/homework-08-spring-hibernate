spring:
  datasource:
    url: jdbc:h2:mem:demo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

hibernate:
  dialect: org.hibernate.dialect.H2Dialect
  hbm2ddl:
     auto: update
  show_sql: true
  format_sql: true
  use_sql_comments: true
